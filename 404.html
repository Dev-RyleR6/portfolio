<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Ryle Anthony Gabotero</title>
  <link rel="shortcut icon" href="assets/icons/tech.svg" type="image/x-icon">
  <script>
    (function() {
      var saved = localStorage.getItem("portfolio-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/refresh.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 3rem) clamp(1rem, 3vw, 2rem);
      background: var(--color-bg);
    }

    .error-card {
      max-width: 28rem;
      width: 100%;
      padding: clamp(1.75rem, 4vw, 2.5rem);
      background: var(--color-surface);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--color-border);
      text-align: center;
    }

    .error-card h1 {
      font-size: 1.45rem;
      font-weight: 700;
      margin: 0 0 0.75rem;
      color: var(--color-text);
    }

    .error-card p {
      color: var(--color-text-light);
      font-size: 0.95rem;
      margin: 0 0 1.5rem;
      line-height: 1.6;
    }

    .error-card .button {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-card">
      <h1>Page not found</h1>
      <p>This URL doesn’t exist or may have moved. Head back to the portfolio home.</p>
      <a href="/" class="button button-primary">Back to home</a>
    </div>
  </div>
</body>
</html>

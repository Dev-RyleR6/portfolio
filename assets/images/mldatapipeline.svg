<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradML" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12181f"/>
      <stop offset="50%" stop-color="#16202a"/>
      <stop offset="100%" stop-color="#0f151c"/>
    </linearGradient>
    <linearGradient id="panelGradML" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#141e2d"/>
    </linearGradient>
    <pattern id="gridML" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="240" rx="16" fill="url(#bgGradML)"/>
  <rect width="800" height="240" rx="16" fill="url(#gridML)"/>
  <rect width="798" height="238" x="1" y="1" rx="15" fill="none" stroke="rgba(96, 165, 250, 0.25)" stroke-width="1.5"/>

  <!-- Top Status Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4" fill="#60a5fa"/>
    <text x="18" y="10" font-family="DM Sans, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#60a5fa" text-transform="uppercase">DATA PIPELINE &amp; NEURAL ARCHITECTURE</text>
    <text x="752" y="10" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="rgba(255,255,255,0.45)" text-anchor="end">KOICA DX CENTER EVALUATION: 10/10 DEEP LEARNING</text>
  </g>

  <!-- Main Pipeline Blocks -->
  <g transform="translate(24, 48)">
    <!-- Stage 1: Extraction & Ingestion -->
    <rect x="0" y="0" width="168" height="120" rx="10" fill="url(#panelGradML)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="0" y="0" width="168" height="26" rx="10" fill="rgba(96, 165, 250, 0.08)"/>
    <text x="14" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">01. INGESTION &amp; ETL</text>
    <text x="14" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Multi-Source Datasets</text>
    <text x="14" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#93c5fd">&gt; Pandas / NumPy</text>
    <text x="14" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Imputation &amp; Cleansing</text>
    <text x="14" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Schema Validation</text>

    <!-- Connector 1 -->
    <path d="M 172 60 L 194 60" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="194,56 200,60 194,64" fill="#60a5fa"/>

    <!-- Stage 2: Feature Engineering -->
    <rect x="202" y="0" width="168" height="120" rx="10" fill="url(#panelGradML)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="202" y="0" width="168" height="26" rx="10" fill="rgba(96, 165, 250, 0.08)"/>
    <text x="216" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">02. FEATURE TENSORS</text>
    <text x="216" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">StandardScaler / Norm</text>
    <text x="216" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#93c5fd">One-Hot Encoding</text>
    <text x="216" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Tensor Batching</text>
    <text x="216" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Train / Test / Val Split</text>

    <!-- Connector 2 -->
    <path d="M 374 60 L 396 60" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="396,56 402,60 396,64" fill="#60a5fa"/>

    <!-- Stage 3: Neural Model -->
    <rect x="404" y="0" width="168" height="120" rx="10" fill="url(#panelGradML)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="404" y="0" width="168" height="26" rx="10" fill="rgba(96, 165, 250, 0.08)"/>
    <text x="418" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">03. NEURAL NETWORK</text>
    <text x="418" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">TensorFlow Architecture</text>
    <text x="418" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#93c5fd">Dense + Dropout Layers</text>
    <text x="418" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Adam Optimizer / Loss</text>
    <text x="418" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">EarlyStopping &amp; Checkpt</text>

    <!-- Connector 3 -->
    <path d="M 576 60 L 598 60" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="598,56 604,60 598,64" fill="#60a5fa"/>

    <!-- Stage 4: Inference API -->
    <rect x="606" y="0" width="146" height="120" rx="10" fill="url(#panelGradML)" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1"/>
    <rect x="606" y="0" width="146" height="26" rx="10" fill="rgba(96, 165, 250, 0.16)"/>
    <text x="618" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">04. INFERENCE</text>
    <text x="618" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#f8fafc">REST Predict API</text>
    <text x="618" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#93c5fd">Low Latency &lt; 25ms</text>
    <text x="618" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#f8fafc">F1 / Recall Monitored</text>
    <text x="618" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#60a5fa">Rank: 10 / 10</text>
  </g>

  <!-- Bottom Metric / Architecture Summary -->
  <g transform="translate(24, 186)">
    <rect x="0" y="0" width="752" height="34" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="16" y="21" font-family="DM Sans, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Competency Domain:</text>
    <text x="156" y="21" font-family="DM Sans, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">KOICA DX Center · 120 Hours Machine Learning &amp; AI Analytics</text>
    <text x="736" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="end">Score: 10/10 Architecture</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradOvaLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12181f"/>
      <stop offset="50%" stop-color="#16202a"/>
      <stop offset="100%" stop-color="#0f151c"/>
    </linearGradient>
    <linearGradient id="panelGradOvaLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#141e2d"/>
    </linearGradient>
    <pattern id="gridOvaLens" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="240" rx="16" fill="url(#bgGradOvaLens)"/>
  <rect width="800" height="240" rx="16" fill="url(#gridOvaLens)"/>
  <rect width="798" height="238" x="1" y="1" rx="15" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

  <!-- Top Status Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
    <text x="18" y="10" font-family="DM Sans, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#38bdf8" text-transform="uppercase">OVALENS // YOLOV8 COMPUTER VISION &amp; IOT PIPELINE</text>
    <text x="752" y="10" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="rgba(255,255,255,0.45)" text-anchor="end">FOUNDATION UNIVERSITY CAPSTONE | ESP32 CONVEYOR IOT</text>
  </g>

  <!-- Main Pipeline Blocks -->
  <g transform="translate(24, 48)">
    <!-- Stage 1: Vision Sensor -->
    <rect x="0" y="0" width="168" height="120" rx="10" fill="url(#panelGradOvaLens)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="0" y="0" width="168" height="26" rx="10" fill="rgba(56, 189, 248, 0.08)"/>
    <text x="14" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">01. VISION SENSOR</text>
    <text x="14" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">IMX179 8MP Sensor</text>
    <text x="14" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#7dd3fc">&gt; Custom Studio Control</text>
    <text x="14" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Manual Exposure/Focus</text>
    <text x="14" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Candling Light Chamber</text>

    <!-- Connector 1 -->
    <path d="M 172 60 L 194 60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="194,56 200,60 194,64" fill="#38bdf8"/>

    <!-- Stage 2: Preprocessing -->
    <rect x="202" y="0" width="168" height="120" rx="10" fill="url(#panelGradOvaLens)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="202" y="0" width="168" height="26" rx="10" fill="rgba(56, 189, 248, 0.08)"/>
    <text x="216" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">02. PREPROCESSING</text>
    <text x="216" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Color Space Normalize</text>
    <text x="216" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#7dd3fc">ROI Candling Crop</text>
    <text x="216" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Contrast Equalization</text>
    <text x="216" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Tensor [640x640x3]</text>

    <!-- Connector 2 -->
    <path d="M 374 60 L 396 60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="396,56 402,60 396,64" fill="#38bdf8"/>

    <!-- Stage 3: YOLOv8 Model -->
    <rect x="404" y="0" width="168" height="120" rx="10" fill="url(#panelGradOvaLens)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="404" y="0" width="168" height="26" rx="10" fill="rgba(56, 189, 248, 0.08)"/>
    <text x="418" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">03. YOLOV8 MODEL</text>
    <text x="418" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Deep Vision Backbone</text>
    <text x="418" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#7dd3fc">Duck Egg Candling</text>
    <text x="418" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Fertile/Infertile/Dead</text>
    <text x="418" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Confidence &gt; 0.80</text>

    <!-- Connector 3 -->
    <path d="M 576 60 L 598 60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="598,56 604,60 598,64" fill="#38bdf8"/>

    <!-- Stage 4: IoT Actuation -->
    <rect x="606" y="0" width="146" height="120" rx="10" fill="url(#panelGradOvaLens)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <rect x="606" y="0" width="146" height="26" rx="10" fill="rgba(56, 189, 248, 0.16)"/>
    <text x="618" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">04. IOT ACTUATION</text>
    <text x="618" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#f8fafc">ESP32 Controller</text>
    <text x="618" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#7dd3fc">Serial UART Link</text>
    <text x="618" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#f8fafc">Pneumatic Gate</text>
    <text x="618" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#38bdf8">Status: 95%+ mAP</text>
  </g>

  <!-- Bottom Metric / Architecture Summary -->
  <g transform="translate(24, 186)">
    <rect x="0" y="0" width="752" height="34" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="16" y="21" font-family="DM Sans, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Capstone Architecture:</text>
    <text x="156" y="21" font-family="DM Sans, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Foundation University · Automated Duck Egg Candling &amp; Sorting Ecosystem</text>
    <text x="736" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="end">Model: YOLOv8 PyTorch</text>
  </g>
</svg>

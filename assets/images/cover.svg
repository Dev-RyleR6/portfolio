<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1117" />
      <stop offset="50%" stop-color="#121820" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>
    <linearGradient id="accentGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e624c" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3eb589" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="accentGlow2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#3eb589" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0c1117" stop-opacity="0" />
    </linearGradient>
    <pattern id="coverGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="32" cy="32" r="1" fill="rgba(62, 181, 137, 0.25)"/>
    </pattern>
    <pattern id="coverSubgrid" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M 128 0 L 0 0 0 128" fill="none" stroke="rgba(62, 181, 137, 0.08)" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" fill="url(#coverBg)"/>
  <rect width="1200" height="300" fill="url(#accentGlow1)"/>
  <rect width="1200" height="300" fill="url(#accentGlow2)"/>
  <rect width="1200" height="300" fill="url(#coverGrid)"/>
  <rect width="1200" height="300" fill="url(#coverSubgrid)"/>

  <!-- Architectural Circuit & Telemetry Traces -->
  <g stroke="rgba(62, 181, 137, 0.35)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trace 1 -->
    <path d="M 0 64 L 240 64 L 288 112 L 560 112 L 608 64 L 880 64 L 928 112 L 1200 112" opacity="0.6"/>
    <!-- Trace 2 -->
    <path d="M 80 0 L 80 140 L 140 200 L 400 200 L 440 240 L 760 240 L 800 200 L 1100 200 L 1140 160 L 1140 0" opacity="0.4"/>
    <!-- Trace 3 (lower line) -->
    <path d="M 300 300 L 360 240 L 520 240 L 560 280 L 820 280 L 860 240 L 1020 240 L 1060 280 L 1200 280" opacity="0.5"/>
  </g>

  <!-- Glowing Telemetry Nodes -->
  <g fill="#3eb589">
    <circle cx="288" cy="112" r="3.5" opacity="0.8"/>
    <circle cx="560" cy="112" r="3.5" opacity="0.8"/>
    <circle cx="608" cy="64" r="3.5" opacity="0.8"/>
    <circle cx="928" cy="112" r="3.5" opacity="0.8"/>
    <circle cx="140" cy="200" r="3.5" opacity="0.7"/>
    <circle cx="440" cy="240" r="3.5" opacity="0.7"/>
    <circle cx="800" cy="200" r="3.5" opacity="0.7"/>
    <circle cx="1060" cy="280" r="3.5" opacity="0.7"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="240" cy="64" r="2.5" opacity="0.9"/>
    <circle cx="880" cy="64" r="2.5" opacity="0.9"/>
    <circle cx="400" cy="200" r="2.5" opacity="0.9"/>
    <circle cx="860" cy="240" r="2.5" opacity="0.9"/>
  </g>

</svg>

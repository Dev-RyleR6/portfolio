<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradTelemetry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141917"/>
      <stop offset="50%" stop-color="#19201d"/>
      <stop offset="100%" stop-color="#111614"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212a26"/>
      <stop offset="100%" stop-color="#171e1b"/>
    </linearGradient>
    <linearGradient id="accentGradTelemetry" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3eb589"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <pattern id="gridTelemetry" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="240" rx="16" fill="url(#bgGradTelemetry)"/>
  <rect width="800" height="240" rx="16" fill="url(#gridTelemetry)"/>
  <rect width="798" height="238" x="1" y="1" rx="15" fill="none" stroke="rgba(62, 181, 137, 0.25)" stroke-width="1.5"/>

  <!-- Top Status Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="6" r="4" fill="#3eb589"/>
    <text x="18" y="10" font-family="DM Sans, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#3eb589" text-transform="uppercase">LIVE TELEMETRY &amp; PACKET PIPELINE</text>
    <text x="752" y="10" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="rgba(255,255,255,0.45)" text-anchor="end">PROTO: TCP/UDP/TLS | ENGINE: SCAPY+C</text>
  </g>

  <!-- Main Pipeline Blocks -->
  <g transform="translate(24, 48)">
    <!-- Stage 1: Ingestion -->
    <rect x="0" y="0" width="168" height="120" rx="10" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="0" y="0" width="168" height="26" rx="10" fill="rgba(62, 181, 137, 0.08)"/>
    <text x="14" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">01. CAPTURE / BUFFER</text>
    <text x="14" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Raw Packet Feed</text>
    <text x="14" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#6ee7b7">&gt; 10Gbps Interface</text>
    <text x="14" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Circular Ring Buffer</text>
    <text x="14" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Zero-copy mmap()</text>

    <!-- Connector 1 -->
    <path d="M 172 60 L 194 60" stroke="#3eb589" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="194,56 200,60 194,64" fill="#3eb589"/>

    <!-- Stage 2: Dissection & Parsing -->
    <rect x="202" y="0" width="168" height="120" rx="10" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="202" y="0" width="168" height="26" rx="10" fill="rgba(62, 181, 137, 0.08)"/>
    <text x="216" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">02. PROTOCOL PARSER</text>
    <text x="216" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Header Unpacking</text>
    <text x="216" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#6ee7b7">Flow Tuple Hashing</text>
    <text x="216" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">DNS / TLS SNI Decode</text>
    <text x="216" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Payload Stripping</text>

    <!-- Connector 2 -->
    <path d="M 374 60 L 396 60" stroke="#3eb589" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="396,56 402,60 396,64" fill="#3eb589"/>

    <!-- Stage 3: Heuristics & Scoring -->
    <rect x="404" y="0" width="168" height="120" rx="10" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="404" y="0" width="168" height="26" rx="10" fill="rgba(62, 181, 137, 0.08)"/>
    <text x="418" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">03. THREAT ENGINE</text>
    <text x="418" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Anomaly Scoring</text>
    <text x="418" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#6ee7b7">Syn Flood / Port Scan</text>
    <text x="418" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Beaconing Detection</text>
    <text x="418" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">Threshold Scoring</text>

    <!-- Connector 3 -->
    <path d="M 576 60 L 598 60" stroke="#3eb589" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="598,56 604,60 598,64" fill="#3eb589"/>

    <!-- Stage 4: Alert Dispatch & Triage -->
    <rect x="606" y="0" width="146" height="120" rx="10" fill="url(#panelGrad)" stroke="rgba(62, 181, 137, 0.4)" stroke-width="1"/>
    <rect x="606" y="0" width="146" height="26" rx="10" fill="rgba(62, 181, 137, 0.16)"/>
    <text x="618" y="17" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#3eb589">04. MITIGATION</text>
    <text x="618" y="48" font-family="ui-monospace, monospace" font-size="10" fill="#f8fafc">Structured JSON</text>
    <text x="618" y="66" font-family="ui-monospace, monospace" font-size="10" fill="#6ee7b7">IPTables Drop Hook</text>
    <text x="618" y="84" font-family="ui-monospace, monospace" font-size="10" fill="#f8fafc">Real-time Alert</text>
    <text x="618" y="104" font-family="ui-monospace, monospace" font-size="9" fill="#3eb589">Status: Armed</text>
  </g>

  <!-- Bottom Metric / Architecture Summary -->
  <g transform="translate(24, 186)">
    <rect x="0" y="0" width="752" height="34" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="16" y="21" font-family="DM Sans, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Competition Tested:</text>
    <text x="144" y="21" font-family="DM Sans, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">WorldSkills Philippines Clark 2026 &amp; Regional Gold Medalist</text>
    <text x="736" y="21" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#3eb589" text-anchor="end">Latency: &lt; 1.2ms / pkt</text>
  </g>
</svg>
